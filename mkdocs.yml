site_name: 'Applications mobiles avec React Native'
site_description: Notes de cours pour le développement d'applications mobiles Android
  avec Jetpack Compose et Kotlin - 420-5B4-VI
site_author: Christiane Lagacé
theme:
  name: material
  language: fr
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Passer au mode sombre
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Passer au mode clair
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - search.suggest
  - search.highlight
  - content.code.copy
extra_css:
- stylesheets/extra.css
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.emoji
plugins:
- search
nav:
- Table des matières: index.md
- Découvrir et préparer React Native:
  - 1. Applications mobiles multiplateformes: 03-1-applications-mobiles-multiplateformes.md
  - 2. Installation de React Native: 04-2-installation-de-react-native.md
  - 3. Création et lancement d'un projet React Native: 05-3-création-et-lancement-dun-projet-react-native.md
  - 4. Les émulateurs et appareils physiques: 06-4-les-émulateurs-et-appareils-physiques.md
- Maîtriser les bases de React Native:
  - 5. Initiation à React Native: 08-6-initiation-react-native.md
  - 6. Les composants du noyau (core components): 09-7-les-composants-du-noyau-core-components.md
  - 7. Rendu conditionnel: 10-8-rendu-conditionnel.md
  - 8. Déboguer une application React Native: 11-9-déboguer-une-application-react-native.md
  - 9. Les hooks: 12-10-les-hooks.md
  - 10. Composants parents vs enfants: 13-11-composants-parents-vs-enfants.md
- Construire une application:
  - 11. La navigation: 14-12-la-navigation.md
  - 12. Les données locales: 15-13-les-données-locales.md
  - 13. Accéder à la base de données de l'émulateur: 16-14-accéder-la-base-de-données-de-lémulateur.md
  - 14. Formulaire React Native: 17-15-formulaire-react-native.md
  - 15. Confirmation avant suppression: 18-16-confirmation-avant-suppression.md
  - 16. Quelques réflexions: 19-17-quelques-réflexions.md
- Étendre et approfondir:
  - 17. Les capteurs: 20-18-les-capteurs.md
  - 18. Utiliser un API: 21-19-utiliser-un-api.md
  - Chapitres de référence: 22-chapitres-de-référence.md
  - 19. Dépannage React Native (troubleshooting): 23-20-dépannage-react-native-troubleshooting.md
  - 20. Quelques notions JavaScript: 24-21-quelques-notions-javascript.md
  - 21. Quelques bibliothèques utiles: 25-22-quelques-bibliothèques-utiles.md
  - 22. Recréer certains dossiers du projet: 26-23-recréer-certains-dossiers-du-projet.md
  - 23. ESLint et Prettier: 27-24-eslint-et-prettier.md
  - 24. Code propre à une plateforme: 28-25-code-propre-une-plateforme.md
